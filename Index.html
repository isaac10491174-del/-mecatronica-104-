<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 Robótica na Mecatrônica - Plataforma Técnica</title>
  
  <!-- Bibliotecas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  
  <style>
    /* ===== CSS GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #2d6a4f;
      --border-color: #d8e2dc;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 15px 50px rgba(0, 0, 0, 0.15);
      --gradient: linear-gradient(135deg, #1b4332, #2d6a4f);
      --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --radius: 20px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2333;
      --text-primary: #e6edf3;
      --text-secondary: #58a6ff;
      --border-color: #30363d;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 15px 50px rgba(0, 0, 0, 0.7);
      --gradient: linear-gradient(135deg, #0d1117, #1c2333);
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      padding: 20px;
      transition: var(--transition);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-secondary);
      border-radius: 10px;
    }

    /* ===== ANIMAÇÕES ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes glow {
      0%,
      100% {
        box-shadow: 0 0 20px rgba(45, 106, 79, 0.2);
      }
      50% {
        box-shadow: 0 0 40px rgba(45, 106, 79, 0.4);
      }
    }

    .animate {
      animation: fadeInUp 0.6s ease forwards;
    }

    /* ===== CONTAINER PRINCIPAL ===== */
    #root {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header-pro {
      background: var(--bg-secondary);
      padding: 30px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      transition: var(--transition);
      border: 1px solid var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-left .logo {
      font-size: 3rem;
      animation: pulse 2s infinite;
    }

    .header-left h1 {
      font-size: 2.2rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left .badge {
      background: var(--text-secondary);
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      -webkit-text-fill-color: white;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .theme-toggle {
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 50px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: var(--transition);
      color: var(--text-primary);
    }

    .theme-toggle:hover {
      transform: rotate(20deg);
      border-color: var(--text-secondary);
    }

    .stats-badge {
      background: var(--gradient);
      color: white;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== GRID DE CARDS ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      cursor: default;
    }

    .stat-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    .stat-card .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: var(--text-secondary);
    }

    .stat-card .number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ===== SEÇÃO RELAÇÃO ===== */
    .relacao-pro {
      background: var(--bg-card);
      padding: 30px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border-left: 8px solid var(--text-secondary);
      transition: var(--transition);
      border: 1px solid var(--border-color);
    }

    .relacao-pro h2 {
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-size: 1.8rem;
    }

    .relacao-pro p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .relacao-pro .highlight {
      background: var(--gradient);
      color: white;
      padding: 2px 12px;
      border-radius: 6px;
      -webkit-text-fill-color: white;
    }

    /* ===== SEÇÃO PILARES ===== */
    .pilares-pro {
      background: var(--bg-card);
      padding: 30px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      transition: var(--transition);
      border: 1px solid var(--border-color);
    }

    .pilares-pro .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }

    .pilares-pro .section-header h2 {
      font-size: 1.8rem;
      color: var(--text-secondary);
    }

    .filters-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 20px;
      border: 2px solid var(--border-color);
      background: transparent;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
      color: var(--text-primary);
    }

    .filter-btn:hover {
      border-color: var(--text-secondary);
      transform: scale(1.05);
    }

    .filter-btn.active {
      background: var(--text-secondary);
      color: white;
      border-color: var(--text-secondary);
    }

    /* ===== BARRA DE PESQUISA AVANÇADA ===== */
    .search-advanced {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-advanced input {
      flex: 1;
      padding: 14px 22px;
      border: 2px solid var(--border-color);
      border-radius: 50px;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: var(--transition);
      min-width: 200px;
      outline: none;
    }

    .search-advanced input:focus {
      border-color: var(--text-secondary);
      box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.15);
    }

    .search-advanced select {
      padding: 14px 22px;
      border: 2px solid var(--border-color);
      border-radius: 50px;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      outline: none;
    }

    .search-advanced select:focus {
      border-color: var(--text-secondary);
    }

    .search-advanced .clear-btn {
      padding: 14px 28px;
      background: var(--text-secondary);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .search-advanced .clear-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(45, 106, 79, 0.3);
    }

    /* ===== TABELA ===== */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background: var(--gradient);
      color: white;
    }

    thead th {
      padding: 16px 20px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
      white-space: nowrap;
    }

    thead th:hover {
      opacity: 0.8;
    }

    thead th .sort-icon {
      margin-left: 8px;
      font-size: 0.7rem;
    }

    tbody td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }

    tbody tr {
      transition: var(--transition);
    }

    tbody tr:hover {
      background: var(--bg-primary);
      transform: scale(1.01);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .pilar-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      background: var(--text-secondary);
      color: white;
    }

    /* ===== GRÁFICO ===== */
    .chart-container {
      background: var(--bg-card);
      padding: 30px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
    }

    .chart-container h3 {
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .chart-wrapper {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      height: 300px;
    }

    /* ===== CICLO ===== */
    .ciclo-pro {
      background: var(--bg-card);
      padding: 30px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
    }

    .ciclo-pro h2 {
      color: var(--text-secondary);
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    .ciclo-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 5px;
      padding: 20px 0;
    }

    .ciclo-step {
      background: var(--gradient);
      color: white;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      transition: var(--transition);
      cursor: default;
      box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
    }

    .ciclo-step:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 8px 30px rgba(45, 106, 79, 0.5);
    }

    .ciclo-arrow {
      font-size: 2rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* ===== FOOTER ===== */
    .footer-pro {
      background: var(--bg-card);
      padding: 25px 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .footer-pro .social {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 1.5rem;
    }

    .footer-pro .social a {
      color: var(--text-secondary);
      transition: var(--transition);
      text-decoration: none;
    }

    .footer-pro .social a:hover {
      transform: translateY(-5px) scale(1.2);
      display: inline-block;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 768px) {
      .header-pro {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }
      .header-left {
        flex-direction: column;
      }
      .header-left h1 {
        font-size: 1.6rem;
      }
      .relacao-pro,
      .pilares-pro,
      .chart-container,
      .ciclo-pro {
        padding: 20px;
      }
      .search-advanced {
        flex-direction: column;
      }
      .search-advanced input,
      .search-advanced select,
      .search-advanced .clear-btn {
        width: 100%;
      }
      .cards-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
      .stats-badge {
        font-size: 0.7rem;
        padding: 6px 14px;
      }
      .ciclo-flow {
        flex-direction: column;
      }
      .ciclo-arrow {
        transform: rotate(90deg);
      }
    }

    @media (max-width: 480px) {
      .header-left h1 {
        font-size: 1.3rem;
      }
      .stat-card .number {
        font-size: 1.6rem;
      }
      .filters-group {
        justify-content: center;
      }
      .filter-btn {
        font-size: 0.75rem;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ===== DADOS COMPLETOS =====
    const dadosRoboticos = [
      {
        id: 1,
        pilar: 'Estrutura mecânica',
        funcao: 'Corpo do robô (braços, juntas, garras)',
        disciplina: 'Mecânica dos sólidos, elementos de máquinas',
        nivel: 'Fundamental',
        categoria: 'Mecânica',
      },
      {
        id: 2,
        pilar: 'Atuadores',
        funcao: 'Motores, cilindros pneumáticos, hidráulicos',
        disciplina: 'Acionamentos elétricos, fluidodinâmica',
        nivel: 'Intermediário',
        categoria: 'Elétrica',
      },
      {
        id: 3,
        pilar: 'Sensores',
        funcao: 'Visão, força, proximidade, torque',
        disciplina: 'Instrumentação eletrônica, transdutores',
        nivel: 'Intermediário',
        categoria: 'Eletrônica',
      },
      {
        id: 4,
        pilar: 'Controle',
        funcao: 'PID, cinemática, planejamento de trajetória',
        disciplina: 'Teoria de controle, sistemas dinâmicos',
        nivel: 'Avançado',
        categoria: 'Controle',
      },
      {
        id: 5,
        pilar: 'Processamento',
        funcao: 'Algoritmos em tempo real, IA',
        disciplina: 'Microcontroladores, programação embarcada',
        nivel: 'Avançado',
        categoria: 'Computação',
      },
      {
        id: 6,
        pilar: 'Interface',
        funcao: 'IHM, teleoperação, supervisão',
        disciplina: 'Automação industrial, redes de comunicação',
        nivel: 'Intermediário',
        categoria: 'Automação',
      },
    ];

    // ===== COMPONENTE PRINCIPAL =====
    function App() {
      const [termoBusca, setTermoBusca] = useState('');
      const [filtroCategoria, setFiltroCategoria] = useState('Todos');
      const [ordenacao, setOrdenacao] = useState({ chave: 'pilar', direcao: 'asc' });
      const [tema, setTema] = useState('light');
      const [visualizacoes, setVisualizacoes] = useState(0);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // ===== CONTADOR DE VISUALIZAÇÕES =====
      useEffect(() => {
        const stored = localStorage.getItem('visualizacoes_robotica');
        const count = stored ? parseInt(stored) + 1 : 1;
        setVisualizacoes(count);
        localStorage.setItem('visualizacoes_robotica', count.toString());
      }, []);

      // ===== TEMA =====
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', tema);
        localStorage.setItem('tema_robotica', tema);
      }, [tema]);

      useEffect(() => {
        const savedTheme = localStorage.getItem('tema_robotica');
        if (savedTheme) setTema(savedTheme);
      }, []);

      const toggleTema = () => {
        setTema(tema === 'light' ? 'dark' : 'light');
      };

      // ===== CATEGORIAS ÚNICAS =====
      const categorias = useMemo(() => {
        const cats = dadosRoboticos.map(d => d.categoria);
        return ['Todos', ...new Set(cats)];
      }, []);

      // ===== FILTROS E ORDENAÇÃO =====
      const dadosFiltrados = useMemo(() => {
        let resultado = dadosRoboticos;

        // Filtro de busca
        if (termoBusca) {
          resultado = resultado.filter(item =>
            Object.values(item).some(valor =>
              String(valor).toLowerCase().includes(termoBusca.toLowerCase())
            )
          );
        }

        // Filtro de categoria
        if (filtroCategoria !== 'Todos') {
          resultado = resultado.filter(item => item.categoria === filtroCategoria);
        }

        // Ordenação
        resultado = [...resultado].sort((a, b) => {
          const valA = String(a[ordenacao.chave]).toLowerCase();
          const valB = String(b[ordenacao.chave]).toLowerCase();
          if (ordenacao.direcao === 'asc') {
            return valA.localeCompare(valB);
          } else {
            return valB.localeCompare(valA);
          }
        });

        return resultado;
      }, [termoBusca, filtroCategoria, ordenacao]);

      // ===== GRÁFICO =====
      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = document.getElementById('chartRobotics');
        if (!ctx) return;

        const categoriasCount = {};
        dadosRoboticos.forEach(d => {
          categoriasCount[d.categoria] = (categoriasCount[d.categoria] || 0) + 1;
        });

        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(categoriasCount),
            datasets: [{
              data: Object.values(categoriasCount),
              backgroundColor: ['#2d6a4f', '#40916c', '#52b788', '#74c69d', '#95d5b2', '#b7e4c7'],
              borderWidth: 3,
              borderColor: '#ffffff',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim(),
                  font: { size: 12, weight: '600' },
                  padding: 20,
                }
              }
            },
            cutout: '60%',
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [tema]);

      // ===== ORDENAÇÃO =====
      const handleSort = (chave) => {
        setOrdenacao(prev => ({
          chave,
          direcao: prev.chave === chave && prev.direcao === 'asc' ? 'desc' : 'asc'
        }));
      };

      // ===== LIMPAR FILTROS =====
      const limparFiltros = () => {
        setTermoBusca('');
        setFiltroCategoria('Todos');
        setOrdenacao({ chave: 'pilar', direcao: 'asc' });
      };

      // ===== RENDER =====
      return (
        <div className="animate">
          {/* HEADER */}
          <header className="header-pro">
            <div className="header-left">
              <span className="logo">🤖</span>
              <div>
                <h1>Robótica na Mecatrônica</h1>
                <span className="badge">⚡ Plataforma Técnica PRO</span>
              </div>
            </div>
            <div className="header-right">
              <div className="stats-badge">
                <i className="fas fa-eye"></i> {visualizacoes} visualizações
              </div>
              <button className="theme-toggle" onClick={toggleTema}>
                {tema === 'light' ? '🌙' : '☀️'}
              </button>
            </div>
          </header>

          {/* STATS CARDS */}
          <div className="cards-grid">
            <div className="stat-card">
              <div className="icon">📚</div>
              <div className="number">{dadosRoboticos.length}</div>
              <div className="label">Pilares da Robótica</div>
            </div>
            <div className="stat-card">
              <div className="icon">🔬</div>
              <div className="number">{new Set(dadosRoboticos.map(d => d.categoria)).size}</div>
              <div className="label">Categorias</div>
            </div>
            <div className="stat-card">
              <div className="icon">📊</div>
              <div className="number">{dadosFiltrados.length}</div>
              <div className="label">Resultados ativos</div>
            </div>
            <div className="stat-card">
              <div className="icon">⚙️</div>
              <div className="number">6</div>
              <div className="label">Disciplinas integradas</div>
            </div>
          </div>

          {/* RELAÇÃO DIRETA */}
          <section className="relacao-pro">
            <h2>🔗 Relação direta</h2>
            <p>
              A <span className="highlight">mecatrônica</span> é a engenharia que integra{' '}
              <strong>mecânica, eletrônica, controle e computação</strong>. A{' '}
              <span className="highlight">robótica</span> é a aplicação máxima dessa integração,
              pois um robô é essencialmente um sistema mecatrônico completo.
            </p>
          </section>

          {/* PILARES */}
          <section className="pilares-pro">
            <div className="section-header">
              <h2>⚙️ Pilares da robótica</h2>
              <div className="filters-group">
                {categorias.map(cat => (
                  <button
                    key={cat}
                    className={`filter-btn ${filtroCategoria === cat ? 'active' : ''}`}
                    onClick={() => setFiltroCategoria(cat)}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* BARRA DE PESQUISA */}
            <div className="search-advanced">
              <input
                type="text"
                placeholder="🔍 Pesquisar por pilar, função ou disciplina..."
                value={termoBusca}
                onChange={(e) => setTermoBusca(e.target.value)}
              />
              <select
                value={ordenacao.chave}
                onChange={(e) => setOrdenacao({ ...ordenacao, chave: e.target.value })}
              >
                <option value="pilar">Ordenar por Pilar</option>
                <option value="funcao">Ordenar por Função</option>
                <option value="disciplina">Ordenar por Disciplina</option>
                <option value="categoria">Ordenar por Categoria</option>
                <option value="nivel">Ordenar por Nível</option>
              </select>
              <button className="clear-btn" onClick={limparFiltros}>
                <i className="fas fa-undo"></i> Limpar
              </button>
            </div>

            {/* TABELA */}
            <div className="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th onClick={() => handleSort('pilar')}>
                      Pilar <span className="sort-icon">↕</span>
                    </th>
                    <th onClick={() => handleSort('funcao')}>
                      O que faz <span className="sort-icon">↕</span>
                    </th>
                    <th onClick={() => handleSort('disciplina')}>
                      Disciplina <span className="sort-icon">↕</span>
                    </th>
                    <th onClick={() => handleSort('categoria')}>
                      Categoria <span className="sort-icon">↕</span>
                    </th>
                    <th onClick={() => handleSort('nivel')}>
                      Nível <span className="sort-icon">↕</span>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  {dadosFiltrados.length > 0 ? (
                    dadosFiltrados.map((item) => (
                      <tr key={item.id}>
                        <td><span className="pilar-badge">{item.pilar}</span></td>
                        <td>{item.funcao}</td>
                        <td>{item.disciplina}</td>
                        <td>{item.categoria}</td>
                        <td>
                          <span style={{
                            display: 'inline-block',
                            padding: '2px 12px',
                            borderRadius: '20px',
                            fontSize: '0.75rem',
                            fontWeight: '600',
                            background: item.nivel === 'Avançado' ? '#ff6b6b' :
                              item.nivel === 'Intermediário' ? '#feca57' : '#48dbfb',
                            color: 'white'
                          }}>
                            {item.nivel}
                          </span>
                        </td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan={5} style={{ textAlign: 'center', padding: '40px' }}>
                        <i className="fas fa-search" style={{ fontSize: '2rem', opacity: 0.5 }}></i>
                        <p style={{ marginTop: '10px' }}>
                          ⚠️ Nenhum resultado encontrado para "<strong>{termoBusca}</strong>"
                        </p>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            <p style={{ marginTop: '15px', fontSize: '0.9rem', color: 'var(--text-secondary)' }}>
              <i className="fas fa-info-circle"></i> Mostrando {dadosFiltrados.length} de {dadosRoboticos.length} pilares
            </p>
          </section>

          {/* GRÁFICO */}
          <section className="chart-container">
            <h3>📊 Distribuição por Categoria</h3>
            <div className="chart-wrapper">
              <canvas id="chartRobotics"></canvas>
            </div>
          </section>

          {/* CICLO */}
          <section className="ciclo-pro">
            <h2>🔄 Ciclo típico de um robô mecatrônico</h2>
            <p style={{ marginBottom: '10px', opacity: 0.8 }}>
              <strong>Sensor → Processamento → Controle → Atuador → Feedback</strong> (recomeça)
            </p>
            <div className="ciclo-flow">
              <span className="ciclo-step">📡 Sensoriamento</span>
              <span className="ciclo-arrow">➜</span>
              <span className="ciclo-step">🧠 Processamento</span>
              <span className="ciclo-arrow">➜</span>
              <span className="ciclo-step">🎛️ Controle</span>
              <span className="ciclo-arrow">➜</span>
              <span className="ciclo-step">⚡ Atuação</span>
              <span className="ciclo-arrow">➜</span>
              <span className="ciclo-step">🔄 Feedback</span>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="footer-pro">
            <p>📘 Conteúdo técnico – Robótica &amp; Mecatrônica</p>
            <p style={{ fontSize: '0.8rem', opacity: 0.6, marginTop: '5px' }}>
              <i className="fas fa-code"></i> Desenvolvido com React, TypeScript e Chart.js
            </p>
            <div className="social">
              <a href="#"><i className="fab fa-github"></i></a>
              <a href="#"><i className="fab fa-linkedin"></i></a>
              <a href="#"><i className="fab fa-youtube"></i></a>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
